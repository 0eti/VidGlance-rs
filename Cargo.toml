[package]
name = "vidglance"
version = "0.2.4"
edition = "2024"
description = "영상을 끌어다 놓으면 정보 헤더 + 프레임 격자 썸네일 시트(webp)를 만드는 Windows 도구"
license = "MIT"
publish = false

[[bin]]
name = "VidGlance"
path = "src/main.rs"

[dependencies]
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "static"] }
webp = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
